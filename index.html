<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lançamento de Recebimentos</title>
  <style>
    :root {
      --azul-claro: #69A0D3;
      --azul-escuro: #00285C;
      --dourado: #D6AE00;
      --branco: #FFFFFF;
      --fundo: #07111F;
      --card: #0B1B32;
      --borda: rgba(255, 255, 255, 0.14);
      --texto-suave: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(105, 160, 211, 0.28), transparent 32%),
        radial-gradient(circle at bottom right, rgba(214, 174, 0, 0.18), transparent 30%),
        linear-gradient(135deg, #040914, var(--fundo));
      color: var(--branco);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: rgba(11, 27, 50, 0.92);
      border: 1px solid var(--borda);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    .badge {
      display: inline-block;
      background: rgba(105, 160, 211, 0.14);
      color: var(--azul-claro);
      border: 1px solid rgba(105, 160, 211, 0.36);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    p {
      color: var(--texto-suave);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--branco);
    }

    .campo {
      margin-bottom: 18px;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--branco);
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    select option {
      background: var(--azul-escuro);
      color: var(--branco);
    }

    input:focus,
    select:focus {
      border-color: var(--azul-claro);
      box-shadow: 0 0 0 4px rgba(105, 160, 211, 0.16);
      background: rgba(255, 255, 255, 0.09);
    }

    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--azul-claro), var(--azul-escuro));
      color: var(--branco);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 14px 32px rgba(105, 160, 211, 0.24);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(105, 160, 211, 0.34);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .mensagem {
      display: none;
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
    }

    .mensagem.sucesso {
      display: block;
      background: rgba(214, 174, 0, 0.13);
      border: 1px solid rgba(214, 174, 0, 0.35);
      color: var(--branco);
    }

    .mensagem.erro {
      display: block;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--branco);
    }

    .linha-detalhe {
      width: 56px;
      height: 4px;
      background: var(--dourado);
      border-radius: 999px;
      margin-bottom: 22px;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <span class="badge">Recebimentos</span>
      <h1>Lançamento de Valores</h1>
      <div class="linha-detalhe"></div>
      <p>Registre os valores recebidos nas adquirências.</p>

      <form id="formLancamento">
        <div class="campo">
          <label for="data">Data</label>
          <input type="date" id="data" name="data" required />
        </div>

        <div class="campo">
          <label for="adquirencia">Nome da Adquirência</label>
          <select id="adquirencia" name="adquirencia" required>
            <option value="" disabled selected>Selecione</option>
            <option value="Cielo">Cielo</option>
            <option value="AdiqWL">AdiqWL</option>
          </select>
        </div>

        <div class="campo">
          <label for="valor">Valor</label>
          <input type="number" id="valor" name="valor" min="0" step="0.01" placeholder="0,00" required />
        </div>

        <button type="submit" id="botaoEnviar">Salvar lançamento</button>
        <div id="mensagem" class="mensagem"></div>
      </form>
    </section>
  </main>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyc_4kOurPtIrIIpgJp8KCqvO0iSLMqXDufImiFC2tuM_N3Hb8JNC5jqphbepu6Oe5z/exec";

    const formulario = document.getElementById("formLancamento");
    const botaoEnviar = document.getElementById("botaoEnviar");
    const mensagem = document.getElementById("mensagem");
    const campoData = document.getElementById("data");

    campoData.valueAsDate = new Date();

    function exibirMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = `mensagem ${tipo}`;
    }

    formulario.addEventListener("submit", async function (evento) {
      evento.preventDefault();

      botaoEnviar.disabled = true;
      botaoEnviar.textContent = "Salvando...";
      mensagem.className = "mensagem";

      const dados = {
        data: document.getElementById("data").value,
        adquirencia: document.getElementById("adquirencia").value,
        valor: document.getElementById("valor").value
      };

      try {
        const resposta = await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dados)
        });

        formulario.reset();
        campoData.valueAsDate = new Date();
        exibirMensagem("Lançamento salvo com sucesso.", "sucesso");
      } catch (erro) {
        exibirMensagem("Não foi possível salvar o lançamento. Tente novamente.", "erro");
      } finally {
        botaoEnviar.disabled = false;
        botaoEnviar.textContent = "Salvar lançamento";
      }
    });
  </script>
</body>
</html>
